[project]
name = "studyflow"
version = "0.1.0"
description = "Agentic AI study companion with adaptive learning and focus enforcement"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.2.40",
  "python-dotenv>=1.0.1",
  "openai>=1.45.0",
]
[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "ruff>=0.6.9",
  "mypy>=1.11.2",
]
[project.scripts]
studyflow = "studyflow.cli:main"
[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
package-dir = {"" = "src"}
[tool.setuptools.packages.find]
where = ["src"]